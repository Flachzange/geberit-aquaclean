name: Trigger Docker dev build

on:
  push:
    branches:
      - dev

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Docker dev workflow
        env:
          DOCKER_WORKFLOW_TOKEN: ${{ secrets.DOCKER_WORKFLOW_TOKEN }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DOCKER_WORKFLOW_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Flachzange/geberit-aquaclean-docker/actions/workflows/docker.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"aquaclean_sha\":\"${GITHUB_SHA}\"}}"
